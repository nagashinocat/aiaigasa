<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>絶対に相合傘をやめさせないゲーム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="rain"></canvas>

  <div id="hud" hidden>
    <div id="doki"><span>ドキドキ</span><div class="bar"><i></i></div></div>
    <div id="couple">
      <div id="bubble"></div>
    </div>
    <div id="meter">
      <div class="track"><b class="band"></b><i class="needle"></i></div>
      <div class="labels"><span>弱</span><span>ちょうどいい</span><span>強</span></div>
    </div>
  </div>

  <canvas id="opening"></canvas>
  <div id="title" class="overlay">
    <p class="hint" hidden>押して雨を降らせよう</p>
    <h1>絶対に相合傘をやめさせないゲーム</h1>
  </div>

  <div id="select" class="overlay" hidden>
    <h2>物語をえらぶ</h2>
    <div id="storyList"></div>
  </div>

  <div id="end" class="overlay" hidden>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <div class="row">
      <button id="retry">もう一度</button>
      <button id="choose" class="ghost">物語をえらぶ</button>
    </div>
  </div>
</div>
<button id="sound" type="button" aria-label="音を消す">♪</button>
<script type="module" src="src/main.js"></script>
</body>
</html>
