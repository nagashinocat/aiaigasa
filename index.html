<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>絶対に相合傘をやめさせないゲーム</title>
<meta name="description" content="雨を降らせて、相合傘のふたりの会話を守り切れ。自分で書いた物語も遊べて、共有できるスマホブラウザゲーム。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="絶対に相合傘をやめさせないゲーム">
<meta property="og:title" content="絶対に相合傘をやめさせないゲーム">
<meta property="og:description" content="この二人の相合傘、守り切れる? 雨を降らせて、ふたりの会話を最後まで守ろう。">
<meta property="og:url" content="https://nagashinocat.github.io/aiaigasa/">
<meta property="og:image" content="https://nagashinocat.github.io/aiaigasa/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="雨の街で相合傘をするふたりと虹">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="絶対に相合傘をやめさせないゲーム">
<meta name="twitter:description" content="この二人の相合傘、守り切れる? #相合傘をやめさせない">
<meta name="twitter:image" content="https://nagashinocat.github.io/aiaigasa/og.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="rain"></canvas>

  <div id="hud" hidden>
    <div id="doki"><span>ドキドキ</span><div class="bar"><i></i></div></div>
    <div id="couple">
      <div id="bubble"></div>
    </div>
    <div id="meter">
      <div class="track"><b class="band"></b><i class="needle"></i></div>
      <div class="labels"><span>弱</span><span>ちょうどいい</span><span>強</span></div>
    </div>
  </div>

  <canvas id="opening"></canvas>
  <div id="title" class="overlay">
    <p class="hint" hidden>押して雨を降らせよう</p>
    <h1>絶対に相合傘をやめさせないゲーム</h1>
  </div>

  <div id="select" class="overlay" hidden>
    <h2>物語をえらぶ</h2>
    <div id="storyList"></div>
  </div>

  <div id="editor" class="overlay" hidden>
    <h2>物語をつくる</h2>
    <div id="edErrors" role="alert"></div>
    <label class="field">題名<input id="edTitle" maxlength="20" autocomplete="off"></label>
    <div class="seg" role="group" aria-label="ふたり">
      <button type="button" data-kids="0">大人のふたり</button><button type="button" data-kids="1">子どものふたり</button>
    </div>
    <p class="help">会話は6〜15行、1行30字まで。最後の2行が山場になります。</p>
    <ol id="edLines"></ol>
    <button type="button" id="edAdd" class="ghost">＋ 行を足す</button>
    <label class="field">雨が上がる前の問いかけ<input id="edAsk" maxlength="40" autocomplete="off"></label>
    <label class="field">虹と一緒に返る答え<input id="edAnswer" maxlength="40" autocomplete="off"></label>
    <div class="row">
      <button type="button" id="edBack" class="ghost">もどる</button>
      <button type="button" id="edPlay">遊んでみる</button>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <button id="share" hidden>この物語を共有する</button>
    <p id="toast" aria-live="polite"></p>
    <div class="row">
      <button id="retry">もう一度</button>
      <button id="choose" class="ghost">物語をえらぶ</button>
    </div>
  </div>
</div>
<button id="sound" type="button" aria-label="音を消す">♪</button>
<script type="module" src="src/main.js"></script>
</body>
</html>
