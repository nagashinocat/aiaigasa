<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>絶対に相合傘をやめさせないゲーム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="rain"></canvas>

  <div id="hud" hidden>
    <div id="doki"><span>ドキドキ</span><div class="bar"><i></i></div></div>
    <div id="couple">
      <div id="bubble"></div>
      <svg viewBox="0 0 120 130" aria-hidden="true">
        <path d="M10 48 Q60 -6 110 48 Q100 42 92 48 Q84 42 76 48 Q68 42 60 48 Q52 42 44 48 Q36 42 28 48 Q20 42 10 48Z" fill="#0e1117"/>
        <rect x="59" y="46" width="2" height="40" fill="#0e1117"/>
        <circle cx="44" cy="66" r="8" fill="#0e1117"/>
        <path d="M33 128 L35 90 Q36 77 44 77 Q52 77 53 90 L55 128Z" fill="#0e1117"/>
        <circle cx="76" cy="62" r="9" fill="#0e1117"/>
        <path d="M64 128 L66 88 Q67 74 76 74 Q85 74 86 88 L88 128Z" fill="#0e1117"/>
      </svg>
    </div>
    <div id="meter">
      <div class="track"><b class="band"></b><i class="needle"></i></div>
      <div class="labels"><span>弱</span><span>ちょうどいい</span><span>強</span></div>
    </div>
  </div>

  <div id="title" class="overlay">
    <h1>絶対に<br>相合傘を<br>やめさせない<br>ゲーム</h1>
    <p class="hint">押して雨を降らせよう</p>
  </div>

  <div id="end" class="overlay" hidden>
    <p id="endText"></p>
    <button id="retry">もう一度</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
